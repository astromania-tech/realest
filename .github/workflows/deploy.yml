name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy application
        run: |
          echo "Add your actual deploy command here for your hosting platform."
          echo "For example: npx vercel --prod"
          echo "Or: npm run deploy"

      - name: Notify Slack Releases on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🚀 *Production deployment successful*",
              "attachments": [{
                "color": "#2EB886",
                "fields": [
                  { "title": "Repo", "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                  { "title": "Commit", "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>", "short": false },
                  { "title": "Triggered by", "value": "${{ github.actor }}", "short": true }
                ]
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_RELEASES }}"

      - name: Notify Slack Incidents on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🔥 *Production deployment failed*",
              "attachments": [{
                "color": "#E01E5A",
                "fields": [
                  { "title": "Repo", "value": "${{ github.repository }}", "short": true },
                  { "title": "Workflow", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed run>", "short": false },
                  { "title": "Author", "value": "${{ github.actor }}", "short": true }
                ]
              }]
            }' \
            "${{ secrets.SLACK_WEBHOOK_INCIDENTS }}"