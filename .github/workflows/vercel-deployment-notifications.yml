name: Vercel Deployment Notifications

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.failed

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow version
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report Vercel deployment
        run: npx tsx scripts/vercel-deployment-notifications.ts
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_REFRESH_TOKEN: ${{ secrets.SLACK_REFRESH_TOKEN }}
          GH_ACTIONS_SECRETS_TOKEN: ${{ secrets.GH_ACTIONS_SECRETS_TOKEN }}
          SLACK_CHANNEL_INCIDENTS: ${{ secrets.SLACK_CHANNEL_INCIDENTS }}
          SLACK_WEBHOOK_RELEASES: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
          SLACK_WEBHOOK_INCIDENTS: ${{ secrets.SLACK_WEBHOOK_INCIDENTS }}
